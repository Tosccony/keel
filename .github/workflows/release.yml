# Builds the installers for Windows, macOS and Linux, each with the MariaDB,
# Apache, PHP and phpMyAdmin that the MariaDB and Web workflows published
# (scripts/fetch-runtimes.sh).
# - Push a tag like v0.1.0 to build and publish a GitHub release.
# - Run it by hand (Actions tab > Release > Run workflow) to test the builds
#   without publishing anything; the installers appear as run artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes can write to the repo.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install C compiler (the window toolkit needs cgo)
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put gcc on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
      # MinGW's windres (installed with gcc) turns packaging/windows/keel.rc
      # into a .syso file, which go build links into keel.exe.
      - name: Embed the icon and version in keel.exe
        shell: bash
        run: |
          mkdir -p dist
          num="${VERSION%%-*}"
          num="${num//./,},0"
          sed "s/@VERSION@/$VERSION/g; s/@VERSION_NUM@/$num/g" packaging/windows/keel.rc > dist/keel.rc
          windres --include-dir packaging/windows -i dist/keel.rc -O coff -o cmd/keel/rsrc_windows_amd64.syso
      - name: Build keel.exe
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$env:VERSION" -o dist\windows\keel.exe ./cmd/keel
      - name: Check keel.exe carries the icon and version
        shell: pwsh
        run: |
          $info = (Get-Item dist\windows\keel.exe).VersionInfo
          $info | Format-List FileDescription, ProductVersion, FileVersion
          if ($info.FileDescription -ne 'Keel') { throw "keel.exe has no version resource, so its icon is missing too" }
      - name: Download the runtimes
        shell: bash
        run: scripts/fetch-runtimes.sh windows-x86_64 dist/runtimes/windows-x86_64
      - name: Download the Visual C++ runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vc14/vc_redist.x64.exe -OutFile dist\vc_redist.x64.exe
          $sig = Get-AuthenticodeSignature dist\vc_redist.x64.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "dist\vc_redist.x64.exe isn't signed by Microsoft ($($sig.Status), $($sig.SignerCertificate.Subject))"
          }
      # The portable version can't run that installer (it needs admin
      # rights), so it carries the runtime's DLLs beside the programs that
      # load them; Windows looks in a program's own folder first.
      - name: Build the portable zip
        shell: pwsh
        run: |
          Start-Process dist\vc_redist.x64.exe -ArgumentList "/install","/quiet","/norestart" -Wait
          $root = "dist\portable\Keel"
          Remove-Item -Recurse -Force dist\portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item dist\windows\keel.exe, packaging\windows\portable.txt $root
          foreach ($part in "mariadb", "apache", "php", "phpmyadmin") {
            Copy-Item -Recurse "dist\runtimes\windows-x86_64\$part" $root
          }
          $dlls = "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "concrt140.dll"
          foreach ($dir in "$root\apache\bin", "$root\php", "$root\mariadb\bin") {
            foreach ($dll in $dlls) { Copy-Item "$env:SystemRoot\System32\$dll" $dir }
          }
          Push-Location dist\portable
          7z a -tzip -mx=9 ..\Keel-Portable-x64.zip Keel | Out-Null
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          Get-Item dist\Keel-Portable-x64.zip | Format-List Name, Length
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          $num = ($env:VERSION -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DAppVersionNumeric=$num" packaging\windows\keel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/Keel-Setup-x64.exe
            dist/Keel-Portable-x64.zip
          if-no-files-found: error

  # Installs the installer and unpacks the portable zip, then checks each
  # with scripts/test-windows-package.sh. The portable zip runs from an
  # exFAT virtual drive, like a student's external drive, and again after
  # the drive gets another letter. A failure here stops the release.
  windows-check:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist
      - name: Build keel-lab
        run: go build -o dist/keel-lab.exe ./cmd/keel-lab
      - name: "Check the portable version on C:"
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP/portable-c")"
          7z x dist/Keel-Portable-x64.zip -o"$dir" >/dev/null
          cp dist/keel-lab.exe "$dir/Keel/"
          scripts/test-windows-package.sh first "$dir/Keel" "$dir/Keel/htdocs"
          [ -d "$dir/Keel/data/mariadb/data" ] || { echo "the databases aren't in the portable folder" >&2; exit 1; }
          [ ! -e "$(cygpath -u "$LOCALAPPDATA")/Keel" ] || { echo "the portable version wrote to $LOCALAPPDATA\Keel" >&2; exit 1; }
      # The exFAT drive and drive-letter checks don't stop a release yet:
      # a virtual drive on a CI machine isn't a student's USB drive, and a
      # failure here is worth reading, not blocking on.
      - name: exFAT drive - make it and unpack the portable zip onto it
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\keel-drive.vhdx"
          @(
            "create vdisk file=`"$vhd`" maximum=8192 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=exfat quick label=KEELDRIVE",
            "assign letter=K"
          ) | Set-Content -Encoding ascii "$env:RUNNER_TEMP\make-drive.txt"
          diskpart /s "$env:RUNNER_TEMP\make-drive.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Volume -DriveLetter K | Format-List DriveLetter, FileSystem, Size
          if ((Get-Volume -DriveLetter K).FileSystem -ne "exFAT") { throw "K: isn't exFAT" }
          7z x dist\Keel-Portable-x64.zip -oK:\ | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\keel-lab.exe K:\Keel\
      - name: exFAT drive - check the portable version
        continue-on-error: true
        run: |
          scripts/test-windows-package.sh first K:/Keel K:/Keel/htdocs
          [ -d K:/Keel/data/mariadb/data ] || { echo "the databases aren't on the drive" >&2; exit 1; }
          [ ! -e "$(cygpath -u "$LOCALAPPDATA")/Keel" ] || { echo "the portable version wrote to $LOCALAPPDATA\Keel" >&2; exit 1; }
      - name: exFAT drive - give it another letter
        continue-on-error: true
        shell: pwsh
        run: |
          @("select volume K", "remove letter=K", "assign letter=L") | Set-Content -Encoding ascii "$env:RUNNER_TEMP\move-drive.txt"
          diskpart /s "$env:RUNNER_TEMP\move-drive.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path L:\Keel\keel.exe)) { throw "the drive isn't on L:" }
      - name: exFAT drive - check the portable version on the new letter
        continue-on-error: true
        run: |
          scripts/test-windows-package.sh again L:/Keel
          [ ! -e "$(cygpath -u "$LOCALAPPDATA")/Keel" ] || { echo "the portable version wrote to $LOCALAPPDATA\Keel" >&2; exit 1; }
      - name: Install Keel
        shell: pwsh
        run: |
          Start-Process dist\Keel-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
          $app = "$env:ProgramFiles\Keel"
          if (-not (Test-Path "$app\keel.exe")) { throw "Keel isn't installed in $app" }
          foreach ($lnk in "$env:PUBLIC\Desktop\Keel.lnk", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Keel.lnk") {
            if (-not (Test-Path $lnk)) { throw "no shortcut at $lnk" }
          }
          Copy-Item dist\keel-lab.exe $app
      - name: Check the installed version
        run: scripts/test-windows-package.sh first "$PROGRAMFILES/Keel" "$RUNNER_TEMP/htdocs"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download the runtimes
        run: scripts/fetch-runtimes.sh macos-universal dist/runtimes/macos-universal
      - name: Build universal app and disk image
        run: scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/Keel-macOS.dmg
          if-no-files-found: error

  linux:
    needs: version
    # Oldest supported runner, so the binary works on older glibc versions too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install window toolkit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Download the runtimes
        run: scripts/fetch-runtimes.sh linux-x86_64 dist/runtimes/linux-x86_64
      - name: Build binary and packages
        run: scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            dist/keel_amd64.deb
            dist/keel_x86_64.rpm
            dist/keel_linux_x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, windows-check, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Keel $GITHUB_REF_NAME" \
            --generate-notes $prerelease
