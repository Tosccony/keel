# nfpm config for the Linux .deb and .rpm packages.
# VERSION comes from the environment (set by scripts/package-linux.sh).
# Paths are relative to the repo root.
name: keel
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: Kody Verhulp <kody.verhulp@gmail.com>
vendor: Kody Verhulp
homepage: https://github.com/Tosccony/keel
description: |
  Local web stack (Apache, PHP, MariaDB) with a small control window.
  Stops the database cleanly instead of killing it.

contents:
  - src: ./dist/linux/keel
    dst: /usr/bin/keel
    file_info:
      mode: 0755
  - src: ./packaging/linux/keel.desktop
    dst: /usr/share/applications/keel.desktop
  - src: ./packaging/linux/keel.png
    dst: /usr/share/icons/hicolor/512x512/apps/keel.png
  - src: ./cmd/keel/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/keel.svg
  # The runtimes, where Keel looks for them: /usr/lib/keel beside /usr/bin.
  - src: ./dist/runtimes/linux-x86_64/mariadb
    dst: /usr/lib/keel/mariadb
    type: tree
  - src: ./dist/runtimes/linux-x86_64/apache
    dst: /usr/lib/keel/apache
    type: tree
  - src: ./dist/runtimes/linux-x86_64/php
    dst: /usr/lib/keel/php
    type: tree
  - src: ./dist/runtimes/linux-x86_64/phpmyadmin
    dst: /usr/lib/keel/phpmyadmin
    type: tree

overrides:
  deb:
    depends:
      - libgl1
  rpm:
    depends:
      - mesa-libGL
      # MariaDB's official build needs libcrypt.so.1, which Fedora and RHEL
      # keep in this package.
      - libxcrypt-compat
